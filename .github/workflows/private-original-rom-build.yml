name: Private original-resource Mii Maker DS build
on:
  push:
    branches:
      - milestone/github-real-nds-private-build-20261031
      - milestone/melonds-private-boot-20261101
      - milestone/saved-mii-rooms-transfer-crown-20261101
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-original-rom:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: "true"
    steps:
      - name: Check required private resource secret
        shell: bash
        env:
          ASSETS_URL: ${{ secrets.MII_ASSETS_URL }}
        run: |
          set -euo pipefail
          if [ -z "$ASSETS_URL" ]; then
            echo "::error title=Private original ZIP missing::Set repository Actions secret MII_ASSETS_URL to an access-controlled direct ZIP download. The public GitHub repository must never contain the original archive."
            exit 1
          fi
          echo "Private resource URL secret is configured (value withheld)."
      - name: Checkout DS source
        uses: actions/checkout@v4
      - name: Prepare host verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3 python3-pil python3-venv curl gnupg
      - name: Fetch owner-supplied ZIP without logging contents
        shell: bash
        env:
          ASSETS_URL: ${{ secrets.MII_ASSETS_URL }}
          ASSETS_TOKEN: ${{ secrets.MII_ASSETS_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          if [ -n "$ASSETS_TOKEN" ]; then
            curl --fail --location --silent --show-error --retry 2 \
              -H "Authorization: Bearer $ASSETS_TOKEN" \
              "$ASSETS_URL" --output /tmp/mii-private-original.zip
          else
            curl --fail --location --silent --show-error --retry 2 \
              "$ASSETS_URL" --output /tmp/mii-private-original.zip
          fi
          # A Google Drive share page can be HTTP 200 but HTML, not a ZIP.
          # Retry via gdown only for Drive share links; never print secret URL.
          if ! python3 -c 'import sys,zipfile;sys.exit(0 if zipfile.is_zipfile(sys.argv[1]) else 1)' /tmp/mii-private-original.zip; then
            python3 -m venv /tmp/mii-private-gdown
            /tmp/mii-private-gdown/bin/pip -q install 'gdown>=5.2,<6'
            /tmp/mii-private-gdown/bin/python - <<'PY'
          import os, sys, zipfile
          from urllib.parse import urlparse
          import gdown
          uri = os.environ["ASSETS_URL"]
          hostname = (urlparse(uri).hostname or "").lower()
          if hostname not in ("drive.google.com", "docs.google.com"):
              raise SystemExit("FAIL: private download is HTML/non-ZIP; set MII_ASSETS_URL to a direct ZIP URL")
          out = "/tmp/mii-private-original.zip"
          if not gdown.download(uri, out, quiet=True, fuzzy=True) or not zipfile.is_zipfile(out):
              raise SystemExit("FAIL: Google Drive did not provide a ZIP; confirm file sharing permissions and direct download access")
          print("PASS: Google Drive private archive downloaded (no URL or contents logged)")
          PY
          fi
          python3 - <<'PY'
          import zipfile
          archive='/tmp/mii-private-original.zip'
          if not zipfile.is_zipfile(archive):
              raise SystemExit('FAIL: private URL did not return a ZIP (check authentication and direct link)')
          print('PASS: private resource ZIP received; no archive contents logged')
          PY
      - name: Validate original resources before extraction
        run: |
          set -euo pipefail
          python3 tools/restore_asset_zip.py /tmp/mii-private-original.zip
          python3 tests/rom_motion_packs.py --source-only --asset-zip /tmp/mii-private-original.zip
          python3 tools/verify_private_clan.py /tmp/mii-private-original.zip
          python3 tools/verify_runtime_assets.py /tmp/mii-private-original.zip
      - name: Restore private resources on isolated runner
        run: |
          set -euo pipefail
          python3 tools/restore_asset_zip.py /tmp/mii-private-original.zip --extract-to .
          python3 tools/check_assets.py
          python3 tools/validate_body_models.py
          python3 tools/test_original_render.py --asset-zip /tmp/mii-private-original.zip
      - name: Compile ARM9/ARM7 with official BlocksDS SDK (no container network)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --cap-drop ALL \
            --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work" \
            -w /work --entrypoint make \
            skylyrac/blocksds:slim-latest SDK_STAGE=1 -j2 mii-ds.nds
      - name: Verify private ROM, all packaged originals, ARM sections, and DS boundaries
        run: |
          set -euo pipefail
          python3 tools/fix_nds_regions.py mii-ds.nds
          test -s mii-ds.nds
          python3 tests/rom_regions.py
          python3 tests/rom_nitrofs_assets.py mii-ds.nds
          python3 tests/rom_all_assets.py mii-ds.nds --asset-zip /tmp/mii-private-original.zip
          python3 tests/rom_body_models.py mii-ds.nds
          python3 tests/rom_motion_packs.py mii-ds.nds --asset-zip /tmp/mii-private-original.zip
          python3 tests/rom_arm_sections.py mii-ds.nds
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          rom=Path("mii-ds.nds")
          print("PASS: actual private ROM compiled and validated")
          print("ROM size:",rom.stat().st_size)
          print("ROM SHA-256:",hashlib.sha256(rom.read_bytes()).hexdigest())
          PY
      - name: Install isolated emulator display packages
        run: |
          sudo apt-get install -y --no-install-recommends xvfb xauth xdotool imagemagick unzip libgl1 libegl1 libglx0 libopengl0 libxcb-cursor0 libxcb-xinerama0 libxkbcommon-x11-0
      - name: Create isolated 10-Mii test cartridge save for emulator only
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I source \
            tools/make_gallery_fixture.c source/save.c source/avatar.c \
            -o "$RUNNER_TEMP/make_gallery_fixture"
          "$RUNNER_TEMP/make_gallery_fixture" mii-ds.sav
          test "$(stat -c %s mii-ds.sav)" -eq 65536
      - name: Boot original-resource ROM under melonDS 1.1 and sample the dual-screen output
        shell: bash
        run: bash tools/run_melonds_headless.sh
      - name: Encrypt completed ROM for private-key-only retrieval
        shell: bash
        run: |
          set -euo pipefail
          test -s mii-ds.nds
          # This repository contains ONLY the public key. The decryption
          # key is delivered privately to the owner, never to GitHub Actions.
          export GNUPGHOME="$RUNNER_TEMP/mii-artifact-gpg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --quiet --import tools/private_rom_recipient.asc
          fingerprint="$(gpg --batch --with-colons --list-keys | awk -F: '$1=="fpr"{print $10; exit}')"
          if [ "$fingerprint" != "31F37EC5CB7248A02306BB93A6EDA2C5FAC54A38" ]; then
            echo "::error::Incorrect public ROM recipient key; refusing to export"
            exit 1
          fi
          umask 077
          gpg --batch --yes --trust-model always --recipient "$fingerprint" \
            --output mii-ds.nds.gpg --encrypt mii-ds.nds
          test -s mii-ds.nds.gpg
          if [ -f "$RUNNER_TEMP/melonds-boot.png" ]; then
            gpg --batch --yes --trust-model always --recipient "$fingerprint" \
              --output melonds-boot.png.gpg --encrypt "$RUNNER_TEMP/melonds-boot.png"
            test -s melonds-boot.png.gpg
          fi
          if [ -s "$RUNNER_TEMP/melonds-gallery-ten.png" ]; then
            gpg --batch --yes --trust-model always --recipient "$fingerprint" \
              --output melonds-gallery-ten.png.gpg --encrypt "$RUNNER_TEMP/melonds-gallery-ten.png"
            test -s melonds-gallery-ten.png.gpg
          fi
          echo "PASS: private ROM and emulator framebuffer encrypted before artifact upload."
      - name: Upload encrypted ROM (plaintext and original assets are never uploaded)
        uses: actions/upload-artifact@v4
        with:
          name: mii-maker-ds-private-encrypted
          path: |
            mii-ds.nds.gpg
            melonds-boot.png.gpg
            melonds-gallery-ten.png.gpg
          retention-days: 7
          if-no-files-found: error
      - name: Delete private game files from runner
        if: always()
        shell: bash
        run: |
          rm -f /tmp/mii-private-original.zip mii-ds.nds mii-ds.sav mii-ds.nds.gpg melonds-boot.png.gpg melonds-gallery-ten.png.gpg
          rm -f "$RUNNER_TEMP/melonds-boot.png" "$RUNNER_TEMP/melonds-gallery-ten.png" "$RUNNER_TEMP/melonds-boot.log"
          rm -rf nitrofiles assets/ui
