name: Original balloon hierarchy (asset-free)
on:
  pull_request:
    paths:
      - 'tools/extract_balloon_layout.py'
      - 'tools/calibrate_balloon_scene.py'
      - 'tools/check_gallery_anchor.py'
      - 'source/menu_generated.h'
      - 'source/menu.c'
      - 'tests/test_extract_balloon_layout.py'
      - 'tests/test_calibrate_balloon_scene.py'
      - 'tests/test_check_gallery_anchor.py'
      - '.github/workflows/gallery-balloon-layout-tests.yml'
  push:
    branches: [main]
    paths:
      - 'tools/extract_balloon_layout.py'
      - 'tools/calibrate_balloon_scene.py'
      - 'tools/check_gallery_anchor.py'
      - 'source/menu_generated.h'
      - 'source/menu.c'
      - 'tests/test_extract_balloon_layout.py'
      - 'tests/test_calibrate_balloon_scene.py'
      - 'tests/test_check_gallery_anchor.py'
      - '.github/workflows/gallery-balloon-layout-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  balloon-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test original CLYT hierarchy extraction without proprietary assets
        run: python3 tests/test_extract_balloon_layout.py
      - name: Fit and reject synthetic runtime scene anchors
        run: python3 tests/test_calibrate_balloon_scene.py
      - name: Reject balloon action collisions with room tabs, boxes and arrows
        run: python3 tests/test_check_gallery_anchor.py
