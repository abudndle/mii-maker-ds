name: Gallery touch actions (asset-free)

on:
  pull_request:
    paths:
      - 'source/main.c'
      - 'source/menu.*'
      - 'source/ui.c'
      - 'source/editor.c'
      - 'tests/gallery_action_touch.c'
      - 'tests/gallery_action_gesture.c'
      - 'tests/gallery_exit.c'
      - 'tests/gallery_action_priority.c'
      - 'tests/test_gallery_action_priority_wiring.py'
      - 'tests/test_gallery_exit_wiring.py'
      - 'tests/test_gallery_action_wiring.py'
      - 'tests/test_private_balloon_art.py'
      - 'tools/private_balloon_art.py'
      - 'tools/restore_asset_zip.py'
      - 'tools/verify_runtime_assets.py'
      - 'tests/rom_all_assets.py'
      - 'source/original_gallery_art.*'
      - '.github/workflows/gallery-action-touch-tests.yml'
  push:
    branches: [main]
    paths:
      - 'source/main.c'
      - 'source/menu.*'
      - 'source/ui.c'
      - 'source/editor.c'
      - 'tests/gallery_action_touch.c'
      - 'tests/gallery_action_gesture.c'
      - 'tests/gallery_exit.c'
      - 'tests/test_gallery_exit_wiring.py'
      - 'tests/test_gallery_action_wiring.py'
      - '.github/workflows/gallery-action-touch-tests.yml'

jobs:
  gallery-touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host C hitboxes and original pane isolation
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isource \
            tests/gallery_action_touch.c source/menu.c -o /tmp/gallery-action-touch
          /tmp/gallery-action-touch
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Isource \
            tests/gallery_action_gesture.c source/menu.c -o /tmp/gallery-action-gesture
          /tmp/gallery-action-gesture
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Isource \
            tests/gallery_exit.c source/menu.c -o /tmp/gallery-exit
          /tmp/gallery-exit
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Isource \
            tests/gallery_action_priority.c source/menu.c -o /tmp/gallery-action-priority
          /tmp/gallery-action-priority
      - name: Source wiring and existing gallery regressions
        run: |
          python3 tests/test_gallery_action_wiring.py
          python3 tests/test_gallery_exit_wiring.py
          python3 tests/test_gallery_action_priority_wiring.py
          python3 tests/test_gallery_favorite_wiring.py
          python3 tests/test_gallery_controls_wiring.py
          python3 tests/test_gallery_drag.py
          python3 tests/test_private_balloon_art.py
          python3 tests/test_original_gallery_art.py
