name: Build Mii Maker DS ROM
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      BLOCKSDS: /opt/wonderful/thirdparty/blocksds/core
      WONDERFUL_TOOLCHAIN: /opt/wonderful
    steps:
      # Validate private inputs before the expensive compiler installation.
      - name: Check private asset configuration
        env:
          ASSETS_URL: ${{ secrets.MII_ASSETS_URL }}
        shell: bash
        run: |
          if [ -z "$ASSETS_URL" ]; then
            echo "::error title=Missing resource archive::Set Actions secret MII_ASSETS_URL to a private direct-download ZIP URL in Settings > Secrets and variables > Actions."
            echo "The source-only tests may run without assets, but ROM packaging requires your extracted assets."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Install required Linux packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential curl unzip python3 python3-pil python3-venv
      - name: Install Wonderful Toolchain and BlocksDS
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/wonderful
          sudo chown "$USER:$USER" /opt/wonderful
          curl -fsSL https://wonderful.asie.pl/bootstrap/wf-bootstrap-x86_64.tar.gz | tar -xz -C /opt/wonderful
          export PATH="/opt/wonderful/bin:$PATH"
          wf-pacman -Syu --noconfirm wf-tools
          wf-config repo enable blocksds
          wf-pacman -Syu --noconfirm
          wf-pacman -S --noconfirm blocksds-toolchain
      - name: Restore original assets from private archive
        shell: bash
        env:
          ASSETS_URL: ${{ secrets.MII_ASSETS_URL }}
          ASSETS_TOKEN: ${{ secrets.MII_ASSETS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$ASSETS_URL" ]; then
            echo "::error::Set repository Actions secret MII_ASSETS_URL to a private ZIP of the locally extracted resource tree (nitrofiles/ and assets/ui/). Do not commit Nintendo assets to this public repository."
            exit 1
          fi
          if [ -n "$ASSETS_TOKEN" ]; then
            curl -fLsS --retry 3 -H "Authorization: Bearer $ASSETS_TOKEN" "$ASSETS_URL" -o /tmp/mii-assets.zip
          else
            curl -fLsS --retry 3 "$ASSETS_URL" -o /tmp/mii-assets.zip
          fi
          # Drive sharing links may return a 200 OK HTML confirmation page.
          if ! python3 -c 'import sys,zipfile;sys.exit(0 if zipfile.is_zipfile(sys.argv[1]) else 1)' /tmp/mii-assets.zip; then
            if [[ "$ASSETS_URL" == *drive.google.com/* || "$ASSETS_URL" == *docs.google.com/* ]]; then
              echo "Google Drive returned a non-ZIP response. Retrying with a Drive-aware downloader."
              python3 -m venv /tmp/mii-drive-venv
              /tmp/mii-drive-venv/bin/python -m pip -q install 'gdown>=5.2,<6'
              /tmp/mii-drive-venv/bin/gdown --fuzzy "$ASSETS_URL" -O /tmp/mii-assets.zip
            else
              echo "::error title=Asset download is not a ZIP::The asset URL returned non-ZIP data. Set MII_ASSETS_URL to a direct ZIP download."
              exit 1
            fi
          fi
          python3 tools/restore_asset_zip.py /tmp/mii-assets.zip --extract-to .
          rm -f /tmp/mii-assets.zip
      - name: Validate input and compile ROM
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/wonderful/bin:/opt/wonderful/toolchain/gcc-arm-none-eabi/bin:$PATH"
          python3 tools/build_preflight.py
          python3 tools/check_assets.py
          make -j2
          test -s mii-ds.nds
          python3 tests/rom_regions.py
      - name: Publish playable candidate
        uses: actions/upload-artifact@v4
        with:
          name: mii-maker-ds-nds
          path: mii-ds.nds
          if-no-files-found: error
          retention-days: 7
