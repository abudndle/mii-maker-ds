name: Portable source tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Protect private ROM release policy
        run: python3 tests/test_private_rom_release.py
      - name: Validate build prerequisite diagnostics
        run: python3 tools/test_build_preflight.py
      - name: Reject corrupt original skeletal motion packs
        run: python3 tests/test_motion_packs.py
      - name: Verify original body model validator rejects corrupt meshes
        run: python3 tests/test_body_models.py
      - name: Verify Mii preview cache recovery and safety guards
        run: python3 tests/test_preview_cache.py
      - name: Verify complete NitroFS asset parity validator
        run: python3 tests/test_rom_all_assets.py
      - name: Verify original Mii model RGB555 color parity
        run: python3 tests/test_flat_rgb555.py
      - name: Link original Mii software renderer without private assets
        run: python3 tools/test_original_render.py --compile-only --cc ${{ matrix.compiler }}
      - name: Run asset-free source tests
        env:
          CC: ${{ matrix.compiler }}
        run: python3 tools/test_host.py --cc "$CC" --no-sanitizers
      - name: Run sanitizer tests
        if: matrix.compiler == 'clang'
        run: python3 tools/test_host.py --cc clang
