name: Portable source tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Protect private ROM release policy
        run: python3 tests/test_private_rom_release.py
      - name: Verify original editor release and invalid feedback wiring
        run: python3 tests/test_clan_adjust_input.py
      - name: Verify original editor arrow and adjustment CLAN curves
        run: python3 -m unittest discover -s tests -p test_generate_clan_adjust.py
      - name: Verify source-derived editor CLAN selection tracks
        run: python3 -m unittest discover -s tests -p test_generate_clan_editor.py
      - name: Verify source-derived dialog pane keys
        run: python3 -m unittest discover -s tests -p test_generate_clan_dialog.py
      - name: Verify source-derived CLAN home track generator
        run: python3 -m unittest discover -s tests -p test_generate_clan_home_visual.py
      - name: Verify CLAN property-keyframe decoder
        run: python3 -m unittest discover -s tests -p test_clan_keyframes.py
      - name: Verify private ZIP extraction rejects unsafe link destinations
        run: python3 tests/test_private_zip_restore.py
      - name: Verify NitroFS UI and sprite runtime preflight
        run: python3 -m unittest discover -s tests -p test_runtime_asset_parity.py
      - name: Verify fictional SDK compile inputs and private Docker workflow
        run: python3 -m unittest discover -s tests -p test_blocksds_build_entry.py
      - name: Verify real compact 8K EEPROM and legacy dual-bank synthetic Mii saves
        run: python3 -m unittest discover -s tests -p test_eeprom_gallery_fixture.py
      - name: Verify received-Mii confirmation cancellation and exact persisted copy
        run: python3 -m unittest discover -s tests -p test_check_gallery_received_copy_save.py
      - name: Verify compact EEPROM Favorite persistence and unrelated-byte safety
        run: python3 -m unittest discover -s tests -p test_check_gallery_favorite_save.py
      - name: Verify private Favorite emulator wiring and encrypted evidence handling
        run: python3 -m unittest discover -s tests -p test_private_favorite_emulator.py
      - name: Verify copied Mii EEPROM bytes and reset ownership flags
        run: python3 -m unittest discover -s tests -p test_check_gallery_copy_save.py
      - name: Verify private second-process melonDS Copy wiring and cleanup
        run: python3 -m unittest discover -s tests -p test_private_copy_restart.py
      - name: Verify running melonDS Qt config origin and B binding (synthetic /proc)
        run: python3 -m unittest discover -s tests -p test_verify_melonds_input_config.py
      - name: Verify trusted third-process Edit/cancel runner and encrypted artifact policy
        run: python3 -m unittest discover -s tests -p test_private_edit_restart.py
      - name: Install Pillow required by strict framebuffer regression tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil
      - name: Verify Edit framebuffer transition rejects ignored touches
        run: python3 -m unittest discover -s tests -p test_melonds_edit_transition.py
      - name: Verify real multi-Mii emulator screenshot acceptance gate
        run: python3 -m unittest discover -s tests -p test_melonds_gallery_probe.py
      - name: Verify received-Mii confirmation framebuffer gate
        run: python3 -m unittest discover -s tests -p test_melonds_confirm_modal.py
      - name: Reject ambiguous received-Mii modal frames before touch retries
        run: python3 -m unittest discover -s tests -p test_melonds_modal_sequence.py
      - name: Verify trusted received-Mii emulator stage and encrypted artifact policy
        run: python3 -m unittest discover -s tests -p test_private_received_restart.py
      - name: Verify original CLAN numeric build-parity gate
        run: python3 -m unittest discover -s tests -p test_verify_private_clan.py
      - name: Verify original balloon CLAN source parity without private assets
        run: python3 -m unittest discover -s tests -p test_verify_balloon_clan.py
      - name: Verify private local ZIP-to-ROM build orchestration
        run: python3 tests/test_private_build.py
      - name: Validate build prerequisite diagnostics
        run: python3 tools/test_build_preflight.py
      - name: Reject corrupt original skeletal motion packs
        run: python3 tests/test_motion_packs.py
      - name: Verify original body model validator rejects corrupt meshes
        run: python3 tests/test_body_models.py
      - name: Verify received Miis require copied editable records
        run: python3 tests/test_received_copy_edit.py
      - name: Verify editor returns to originating gallery or home
        run: python3 tests/test_editor_return_navigation.py
      - name: Verify DS cartridge save null-gallery guards
        run: python3 tests/test_cart_save_guards.py
      - name: Verify saturated DS input queue preserves new presses
        run: python3 tests/test_input_queue.py
      - name: Verify original 53-clip gallery controls and gender mapping
        run: python3 tests/test_gallery_motion_controls.py
      - name: Verify stylus gallery reordering and transactional swaps
        run: python3 tests/test_gallery_drag.py
      - name: Verify interrupted Mii gallery previews retry after input settles
        run: python3 tests/test_gallery_retry.py
      - name: Verify room movement phases resume across L/R room navigation
        run: python3 tests/test_room_walk_persistence.py
      - name: Verify Mii preview cache recovery and safety guards
        run: python3 tests/test_preview_cache.py
      - name: Verify complete NitroFS asset parity validator
        run: python3 tests/test_rom_all_assets.py
      - name: Verify original Mii L/R camera controls and view cache
        run: python3 tests/test_view_controls.py
      - name: Verify original Mii model RGB555 color parity
        run: python3 tests/test_flat_rgb555.py
      - name: Verify private MSP1 rendering stage and automatic temporary cleanup
        run: python3 -m unittest discover -s tests -p test_original_motion_render_runner.py
      - name: Link original Mii software renderer without private assets
        run: python3 tools/test_original_render.py --compile-only --cc ${{ matrix.compiler }}
      - name: Verify DSi RGB555 photo quality and capture gating
        env:
          CC: ${{ matrix.compiler }}
        run: python3 -m unittest discover -s tests -p test_photo_quality.py
      - name: Verify three photo candidates preserve profile and cancel without saves
        env:
          CC: ${{ matrix.compiler }}
        run: python3 -m unittest discover -s tests -p test_photo_candidates_host.py
      - name: Verify DSi-only create method selection and first-boot gating
        run: python3 -m unittest discover -s tests -p test_create_method.py
      - name: Verify experimental DSi eye-pair framing cue with synthetic RGB555 frames
        env:
          CC: ${{ matrix.compiler }}
        run: python3 -m unittest discover -s tests -p test_face_hint.py
      - name: Test experimental photo-derived candidate generation and UI wiring
        env:
          CC: ${{ matrix.compiler }}
        run: python3 -m unittest discover -s tests -p test_photo_suggest.py
      - name: Verify photo suggestion touch navigation, cancel and camera retry
        env:
          CC: ${{ matrix.compiler }}
        run: python3 -m unittest discover -s tests -p test_photo_candidate_input.py
      - name: Verify adaptive eye-pair geometry, position and stripe rejection
        env:
          CC: ${{ matrix.compiler }}
        run: python3 -m unittest discover -s tests -p test_eye_pair.py
      - name: Require photo candidate gestures to activate on stylus release
        env:
          CC: ${{ matrix.compiler }}
        run: python3 -m unittest discover -s tests -p test_photo_touch_release.py
      - name: Verify sampled VBlank photo touch paths cannot re-arm on release
        env:
          CC: ${{ matrix.compiler }}
        run: python3 -m unittest discover -s tests -p test_photo_touch_vblank.py
      - name: Verify experimental photo suggestion failure diagnostics
        env:
          CC: ${{ matrix.compiler }}
        run: python3 -m unittest discover -s tests -p test_photo_suggest_diagnostics.py
      - name: Verify DSi camera capture, retake, error cleanup and private RAM scrub
        env:
          CC: ${{ matrix.compiler }}
        run: python3 -m unittest discover -s tests -p test_camera_ds_lifetime.py
      - name: Verify male/female scratch Mii presets and camera key priority
        env:
          CC: ${{ matrix.compiler }}
        run: python3 -m unittest discover -s tests -p test_camera_creation_defaults.py
      - name: Verify gender chooser previews distinct default Miis without changing drafts
        env:
          CC: ${{ matrix.compiler }}
        run: python3 -m unittest discover -s tests -p test_gender_starter_preview.py
      - name: Verify gender cancel atomicity and Personal Mii creation baseline
        env:
          CC: ${{ matrix.compiler }}
        run: python3 -m unittest discover -s tests -p test_gender_atomic_creation.py
      - name: Run asset-free source tests
        env:
          CC: ${{ matrix.compiler }}
        run: python3 tools/test_host.py --cc "$CC" --no-sanitizers
      - name: Run sanitizer tests
        if: matrix.compiler == 'clang'
        run: python3 tools/test_host.py --cc clang
