name: BlocksDS ARM9 and ARM7 compile smoke (synthetic assets only)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  blocksds-compile-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      MDS_SYNTHETIC_COMPILE_ONLY: "yes"
    steps:
      - uses: actions/checkout@v4
      - name: Verify synthetic build safeguards and private Docker wrapper
        run: python3 -m unittest discover -s tests -p test_blocksds_build_entry.py
      - name: Generate synthetic UI/asset placeholders for compiler only
        run: python3 tools/generate_ci_compile_assets.py
      - name: Compile and link ARM9/ARM7 using official BlocksDS container
        run: |
          docker run --rm --network none --cap-drop ALL \
            --security-opt no-new-privileges \
            -v "$PWD:/work" -w /work --entrypoint make \
            skylyrac/blocksds:slim-latest SDK_STAGE=1 -j2 mii-ds.nds
      - name: Fix and verify synthetic ROM executable sections and DS boundaries
        run: |
          python3 tools/fix_nds_regions.py mii-ds.nds
          python3 tests/rom_arm_sections.py mii-ds.nds
          python3 tests/rom_regions.py
      - name: Delete fake ROM (never publish or distribute)
        if: always()
        run: rm -f mii-ds.nds
