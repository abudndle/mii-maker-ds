name: Public-safe synthetic melonDS PNG screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-synthetic-screenshots.yml'
      - 'tools/capture_public_synthetic_screenshots.sh'
      - 'public-demo/**'
permissions:
  contents: read
jobs:
  synthetic-screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      MDS_PUBLIC_DEMO_ONLY: "yes"
    steps:
      - uses: actions/checkout@v4
      - name: Install screenshot tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xdotool imagemagick unzip python3-pil libegl1 libgl1 libopengl0 libxkbcommon-x11-0
      - name: Build independent asset-free homebrew ROM
        run: |
          docker run --rm --network none --cap-drop ALL \
            --user "$(id -u):$(id -g)" --security-opt no-new-privileges \
            -v "$PWD:/work" -w /work/public-demo --entrypoint make \
            skylyrac/blocksds:slim-latest -j2 public-demo.nds
          test -s public-demo/public-demo.nds
          python3 - <<'PY'
          from pathlib import Path
          rom = Path("public-demo/public-demo.nds").read_bytes()
          assert len(rom) >= 0x200, "ROM header missing"
          arm9_offset = int.from_bytes(rom[0x20:0x24], "little")
          arm9_size = int.from_bytes(rom[0x2c:0x30], "little")
          arm7_offset = int.from_bytes(rom[0x30:0x34], "little")
          arm7_size = int.from_bytes(rom[0x3c:0x40], "little")
          assert arm9_size > 0 and arm7_size > 0, "ARM payload missing"
          assert arm9_offset + arm9_size <= len(rom), "ARM9 payload out of bounds"
          assert arm7_offset + arm7_size <= len(rom), "ARM7 payload out of bounds"
          print("PASS: independent homebrew ROM ARM9/ARM7 sections in bounds")
          PY
      - name: Capture synthetic melonDS screen and verify PNG
        if: success()
        run: bash tools/capture_public_synthetic_screenshots.sh
      - name: Upload PNG only (never ROM or private source assets)
        uses: actions/upload-artifact@v4
        with:
          name: public-safe-synthetic-melonds-png
          path: public-screenshots/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Remove synthetic ROM and images from runner
        if: always()
        run: rm -f public-demo/public-demo.nds
