name: Public-safe synthetic melonDS PNG screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-synthetic-screenshots.yml'
      - 'tools/capture_public_synthetic_screenshots.sh'
permissions:
  contents: read
jobs:
  synthetic-screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      MDS_SYNTHETIC_COMPILE_ONLY: "yes"
    steps:
      - uses: actions/checkout@v4
      - name: Install screenshot tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xdotool imagemagick unzip python3-pil
      - name: Build independent asset-free homebrew ROM
        run: |
          docker run --rm --network none --cap-drop ALL \
            --user "$(id -u):$(id -g)" --security-opt no-new-privileges \
            -v "$PWD:/work" -w /work/public-demo --entrypoint make \
            skylyrac/blocksds:slim-latest -j2 public-demo.nds
          test -s public-demo/public-demo.nds
          python3 tests/rom_arm_sections.py public-demo/public-demo.nds
      - name: Capture synthetic melonDS screen and verify PNG
        if: success()
        run: bash tools/capture_public_synthetic_screenshots.sh
      - name: Upload PNG only (never ROM or private source assets)
        uses: actions/upload-artifact@v4
        with:
          name: public-safe-synthetic-melonds-png
          path: public-screenshots/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Remove synthetic ROM and images from runner
        if: always()
        run: rm -f public-demo/public-demo.nds
