name: Private original-asset validation cache (synthetic only)
on:
  push:
    paths:
      - 'tools/private_validation_cache.py'
      - 'tools/build_private.py'
      - 'tools/build_private_docker.py'
      - 'tests/test_private_validation_cache.py'
      - '.github/workflows/private-validation-cache-tests.yml'
  pull_request:
    paths:
      - 'tools/private_validation_cache.py'
      - 'tools/build_private.py'
      - 'tools/build_private_docker.py'
      - 'tests/test_private_validation_cache.py'
      - '.github/workflows/private-validation-cache-tests.yml'
permissions:
  contents: read
jobs:
  private-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate content-addressed cache, rebuild and failure safety
        run: python3 -m unittest discover -s tests -p test_private_validation_cache.py -v
      - name: Retain safe offline private builder integration
        run: python3 -m unittest discover -s tests -p test_blocksds_build_entry.py -v
