name: Portable host tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify original editor release, invalid and key-up wiring
        run: python3 tests/test_clan_adjust_input.py && python3 tests/test_input_queue.py
      - name: Verify original editor arrow and adjustment CLAN curves
        run: python3 -m unittest discover -s tests -p test_generate_clan_adjust.py
      - name: Verify source-derived editor CLAN selection tracks
        run: python3 -m unittest discover -s tests -p test_generate_clan_editor.py
      - name: Verify source-derived dialog pane keys
        run: python3 -m unittest discover -s tests -p test_generate_clan_dialog.py
      - name: Verify source-derived CLAN home track generator
        run: python3 -m unittest discover -s tests -p test_generate_clan_home_visual.py
      - name: Verify CLAN keyframe decoder
        run: python3 -m unittest discover -s tests -p test_clan_keyframes.py
      - name: Verify NitroFS UI and sprite runtime preflight
        run: python3 -m unittest discover -s tests -p test_runtime_asset_parity.py
      - name: Verify fictional SDK compile inputs and private Docker workflow
        run: python3 -m unittest discover -s tests -p test_blocksds_build_entry.py
      - name: Install PNG verification library for screen acceptance regressions
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil
      - name: Verify real multi-Mii emulator screenshot acceptance gate
        run: python3 -m unittest discover -s tests -p test_melonds_gallery_probe.py
      - name: Verify original CLAN numeric build-parity gate
        run: python3 -m unittest discover -s tests -p test_verify_private_clan.py
      - name: Run asset-free sanitizer tests
        run: python3 tests/test_private_rom_release.py && python3 tools/test_host.py
