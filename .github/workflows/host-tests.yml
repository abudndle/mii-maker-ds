name: Portable host tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source-derived editor CLAN selection tracks
        run: python3 -m unittest discover -s tests -p test_generate_clan_editor.py
      - name: Verify source-derived dialog pane keys
        run: python3 -m unittest discover -s tests -p test_generate_clan_dialog.py
      - name: Verify source-derived CLAN home track generator
        run: python3 -m unittest discover -s tests -p test_generate_clan_home_visual.py
      - name: Verify CLAN keyframe decoder
        run: python3 -m unittest discover -s tests -p test_clan_keyframes.py
      - name: Run asset-free sanitizer tests
        run: python3 tests/test_private_rom_release.py && python3 tools/test_host.py
